name: CI and Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and game checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore tests/KyarKwat.Checks
      - name: Run game-rule and AI checks
        run: dotnet run --project tests/KyarKwat.Checks -c Release --no-restore
      - name: Publish WebAssembly app
        run: |
          dotnet publish BlazorWasm.KyarKwat -c Release --no-restore -o artifacts/ci-publish
          test -f artifacts/ci-publish/wwwroot/index.html
          test -f artifacts/ci-publish/wwwroot/_framework/blazor.webassembly.js
          test -f artifacts/ci-publish/wwwroot/branding/social-card-tiger.jpg

  production-smoke:
    name: Check Vercel production
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for this commit on Vercel
        run: |
          for attempt in {1..30}; do
            deployed_commit="$(curl --fail --silent --max-time 5 \
              https://kyarkwat.vercel.app/deployment.json | jq -r '.commit // empty')" || deployed_commit=""
            if [[ "$deployed_commit" == "$GITHUB_SHA" ]]; then
              echo "Vercel is serving commit $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "Vercel did not serve commit $GITHUB_SHA within the wait window."
          exit 1
      - name: Check live page, runtime and sharing image
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 30 \
            https://kyarkwat.vercel.app/ --output "$RUNNER_TEMP/kyarkwat.html"
          grep -Fq '_framework/blazor.webassembly.js' "$RUNNER_TEMP/kyarkwat.html"
          curl --fail --silent --show-error --retry 3 --max-time 30 \
            https://kyarkwat.vercel.app/_framework/blazor.webassembly.js --output /dev/null
          curl --fail --silent --show-error --retry 3 --max-time 30 \
            https://kyarkwat.vercel.app/branding/social-card-tiger.jpg --output /dev/null
